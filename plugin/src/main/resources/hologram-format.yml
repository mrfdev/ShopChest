# ===============================================
# === ShopChest's hologram configuration file ===
# ===============================================
#
# Valid requirements are:
# VENDOR, AMOUNT, ITEM_TYPE, ITEM_NAME, HAS_ENCHANTMENT, HAS_ITEM_DETAILS,
# BUY_PRICE, SELL_PRICE, HAS_POTION_EFFECT, IS_MUSIC_DISC, IS_POTION_EXTENDED,
# IS_WRITTEN_BOOK, IS_BANNER_PATTERN, ADMIN_SHOP, NORMAL_SHOP,
# IN_STOCK, OUT_OF_STOCK, MAX_STACK, CHEST_SPACE, DURABILITY
#
# You can also use the requirements for conditions.
# ITEM_TYPE will return the type of the item (-> See Bukkit Material enum),
# ITEM_NAME can be compared against a custom named item's name (may be null).
#
# Examples:
#   - IN_STOCK > 0
#   - VENDOR == "EpicEric"
#   - BUY_PRICE <= SELL_PRICE
#   - ITEM_TYPE == "STONE:2"
#   - ITEM_TYPE != "IRON_INGOT"
#   - ITEM_NAME == "The Mighty Sword"
#   - (AMOUNT > 10) && (AMOUNT <= 20)
#   - (IN_STOCK > 0) || ADMIN_SHOP
#
# Valid placeholders are:
# %VENDOR%, %AMOUNT%, %ITEMNAME%, %ENCHANTMENT%, %ITEM-DETAILS%,
# %BUY-PRICE%, %SELL-PRICE%, %POTION-EFFECT%, %MUSIC-TITLE%, %BANNER-PATTERN-NAME%,
# %GENERATION%, %STOCK%, %MAX-STACK%, %CHEST-SPACE%, %DURABILITY%,
# %COLOR-OWNER%, %COLOR-QUANTITY%, %COLOR-ITEM%, %COLOR-LABEL%,
# %COLOR-BUY-VALUE%, %COLOR-SELL-VALUE%, %COLOR-SEPARATOR%, %COLOR-ADMIN%,
# %COLOR-UNAVAILABLE%, %COLOR-RESET%
#
# In the format, placeholders can also be used for scripts.
# Examples:
#   - "In Stock: {%STOCK% / 64} Stk."
#   - "In Stock: {(%STOCK% - (%STOCK% % 64)) / 64} Stk. {%STOCK% % 64}"
#
# Other information:
# - Options can be called however you want.
# - Color codes can be used in the format.
# - Options are checked from top to bottom; the first to
#   fulfill the requirements will be taken.
# - All scripts have to be in JavaScript syntax.
# - Lines start with 0.

lines:
  0:
    options:
      normal-shop:
        format: "%COLOR-OWNER%%VENDOR%%COLOR-RESET%"
        requirements:
          - NORMAL_SHOP

      admin-shop:
        format: "%COLOR-ADMIN%Admin Shop%COLOR-RESET%"
        requirements:
          - ADMIN_SHOP

  1:
    options:
      default:
        format: "%COLOR-QUANTITY%%AMOUNT% x %COLOR-ITEM%%ITEMNAME%%COLOR-RESET%"
        requirements:

  2:
    options:
      item-details:
        format: "%ITEM-DETAILS%"
        requirements:
          - HAS_ITEM_DETAILS

  3:
    options:
      buy-and-sell:
        format: "%COLOR-LABEL%Buy: %COLOR-BUY-VALUE%%BUY-PRICE% %COLOR-SEPARATOR%| %COLOR-LABEL%Sell: %COLOR-SELL-VALUE%%SELL-PRICE%%COLOR-RESET%"
        requirements:
          - BUY_PRICE > 0
          - SELL_PRICE > 0

      only-buy:
        format: "%COLOR-LABEL%Buy: %COLOR-BUY-VALUE%%BUY-PRICE%%COLOR-RESET%"
        requirements:
          - BUY_PRICE > 0

      only-sell:
        format: "%COLOR-LABEL%Sell: %COLOR-SELL-VALUE%%SELL-PRICE%%COLOR-RESET%"
        requirements:
          - SELL_PRICE > 0
