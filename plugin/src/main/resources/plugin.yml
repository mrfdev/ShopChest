# Do not change anything in here unless you know what you're doing!

name: ShopChest
main: de.epiceric.shopchest.ShopChest
version: ${version}
author: EpicEric
description: Create persistent container shops and trade items with other players.
softdepend: [CMI, WorldGuard, Towny, AuthMe, PlotSquared, uSkyBlock, ASkyBlock, IslandWorld, GriefPrevention, AreaShop, Multiverse-Core, MultiWorld, BentoBox]
depend: [Vault]
api-version: '${paperVersion}'

permissions:
  shopchest.*:
    description: Gives access to all ShopChest permissions.
    default: op
    children:
      shopchest.create: true
      shopchest.create.buy: true
      shopchest.create.sell: true
      shopchest.create.admin: true
      shopchest.create.protected: true
      shopchest.remove.other: true
      shopchest.remove.admin: true
      shopchest.buy: true
      shopchest.sell: true
      shopchest.openOther: true
      shopchest.reload: true
      shopchest.limit.*: true
      shopchest.config: true
      shopchest.extend.other: true
      shopchest.extend.protected: true
      shopchest.external.bypass: true
      shopchest.admin: true
      shopchest.recent: true
      shopchest.profile: true
      shopchest.search: true
      shopchest.advertise: true
  shopchest.create:
    description: Allows you to create a shop.
    children:
      shopchest.create.buy: true
      shopchest.create.sell: true
    default: true
  shopchest.create.buy:
    description: Allows you to create a buy-shop.
    default: true
  shopchest.create.sell:
    description: Allows you to create a sell-shop.
    default: true
  shopchest.create.admin:
    description: Allows you to create an admin shop.
    children:
      shopchest.create: true
    default: op
  shopchest.create.protected:
    description: Allows you to create a shop on a protected container or in a protected region.
    children:
      shopchest.create: true
    default: op
  shopchest.remove.other:
    description: Allows you to remove other players' shops.
    default: op
  shopchest.remove.admin:
    description: Allows you to remove admin shops.
    default: op
  shopchest.buy:
    description: Allows you to buy something.
    default: true
  shopchest.sell:
    description: Allows you to sell something.
    default: true
  shopchest.openOther:
    description: Allows you to open other players' shops.
    default: op
  shopchest.reload:
    description: Allows you to reload the shops.
    default: op
  shopchest.limit.*:
    default: op
  shopchest.config:
    description: Allows you to change configuration values per command.
    default: op
  shopchest.extend.other:
    description: Allows you to extend other players' shops.
    default: op
  shopchest.extend.protected:
    description: Allows you to extend shops into a protected region.
    default: op
  shopchest.external.bypass:
    description: Allows you to to use shops regions/plots that deny shop use.
    default: op
  shopchest.admin:
    description: Gives access to ShopChest administration commands.
    default: op
    children:
      shopchest.admin.list: true
      shopchest.admin.audit: true
      shopchest.admin.debug: true
      shopchest.admin.storefront: true
      shopchest.admin.advertise: true
      shopchest.admin.export: true
  shopchest.admin.list:
    description: Allows listing another player's shops and teleporting to them.
    default: op
  shopchest.admin.audit:
    description: Allows dry-run maintenance audits of persisted shops without loading chunks.
    default: op
  shopchest.admin.debug:
    description: Allows ShopChest support status, command, permission, and placeholder diagnostics.
    default: op
  shopchest.admin.storefront:
    description: Allows hiding or suspending public storefront profiles.
    default: op
  shopchest.admin.advertise:
    description: Allows managing ShopChest advertising and capturing its currency template.
    default: op
  shopchest.admin.export:
    description: Allows creating a reviewed public marketplace snapshot export.
    default: op
  shopchest.recent:
    description: Allows viewing your own recent ShopChest transactions.
    default: true
  shopchest.profile:
    description: Allows creating and viewing public storefront profiles.
    default: true
  shopchest.search:
    description: Allows searching public customer-buy shop listings.
    default: true
  shopchest.advertise:
    description: Allows buying an advertising pass and queuing a storefront advertisement.
    default: true
