# ===============================================
# ====== Configuration File of 'ShopChest' ======
# ===============================================
#
# Lines starting with '#' are comments and are ignored by the server.
#

# Set the main command you have to enter to manage the shops.
# (default: "/shops ...")
main-command-name: "shops"

# Set the language file for all translatable messages or names.
# The value must equal to the name of one of a file in the 'lang' folder
# (without the '.lang' extension).
language-file: "en_US"

# Set the item with which a player can click a shop to retrieve information.
# You can set this to an empty string ("") to disable this feature.
shop-info-item: "STICK"

# Set whether buys or sells need to be confirmed by the player
# in order to prevent accidents.
confirm-shopping: false

# Silently ignore additional buy or sell attempts from the same player during
# this interval. This limits packet/click spam before permission, inventory,
# economy, and database work. Set to 0 to disable; values are capped at 5000.
trade-interaction-cooldown-milliseconds: 250

# Wait before showing the offline shop-revenue summary after a player joins,
# leaving the initial welcome/MOTD messages clear. Set to 0 to send it as soon
# as the database result is ready; values are capped at 30 seconds.
offline-revenue-notification-delay-seconds: 3

# Configure player-local feedback for completed and failed trade attempts.
# Set either outcome's enabled value to false to disable it. Set a sound or
# particle to "none" to disable only that part. Particle counts are capped at
# 16; only the player attempting the trade receives these effects.
trade-feedback:
  success:
    enabled: true
    sound: "minecraft:entity.experience_orb.pickup"
    volume: 0.45
    pitch: 1.20
    particle: "minecraft:happy_villager"
    particle-count: 4
  failure:
    enabled: true
    sound: "minecraft:block.note_block.bass"
    volume: 0.35
    pitch: 0.70
    particle: "minecraft:smoke"
    particle-count: 3

# Set whether players should be able to select the shop item from the
# creative inventory if they don't hold an item in their hand.
creative-select-item: true

# Set whether the (current) shop creation price should be refunded
# when the shop is removed by its creator.
refund-shop-creation: false

# Set whether buys and sells should be logged in the database.
enable-economy-log: false

# Set the maximum age for economy log entries in days.
# All log entries older than this will be deleted on server start.
# Set this to 0 to disable this feature.
cleanup-economy-log-days: 30

# Set whether a debug log file should be created.
# The file may get large! Please enable this setting when reporting issues.
enable-debug-log: false

# Set whether various protection plugins should be hooked into (if installed)
# in order to allow or deny shop creation in certain locations.
enable-worldguard-integration: true
enable-towny-integration: true
enable-authme-integration: true
enable-plotsquared-integration: true
enable-uskyblock-integration: true
enable-askyblock-integration: true
enable-bentobox-integration: true
enable-islandworld-integration: true
enable-griefprevention-integration: true
enable-areashop-integration: true

# Set whether the vendor of a shop should get messages when players buy
# or sell something from/to his shop or when his shop is out of stock.
enable-vendor-messages: true

# Set whether the vendor of a shop should get messages on all servers when players
# buy or sell something from/to his shop or when his shop is out of stock.
enable-vendor-bungee-messages: false

# Set whether only the shop a player is pointing at should be shown.
# If set to false, every shop near the player (with the specified
# distance) will be shown to him.
only-show-shops-in-sight: true

# Set whether the hologram's location should be fixed at the bottom,
# so when it gets more lines, it won't interfere with the item or chest,
# but goes higher.
hologram-fixed-bottom: true

# Set the amount (may be negative) a hologram should be lifted in the y-axis.
# A value of '1' equals to one block, and a value of '0.25' is equal to the
# height of one line.
hologram-lift: 0.25

# Set the maximum width of the complete hologram text panel in client font
# pixels. Text that does not fit wraps inside the panel without overlapping
# neighboring hologram lines. Valid values are clamped between 40 and 1024.
hologram-panel-width: 200

# Set the visual scale of the complete TextDisplay panel. Lower values make
# neighboring shop holograms easier to distinguish while scaling the text and
# background together. Values are clamped between 0.50 and 1.25.
hologram-text-scale: 0.50

# Set the TextDisplay panel background color and opacity. The opacity range is
# 0 (transparent) through 255 (opaque). The defaults use a muted blue that
# remains readable against both bright skies and darker surroundings.
hologram-background-color: "#315B7D"
hologram-background-opacity: 112

# Set the remaining native TextDisplay presentation options. Text opacity ranges
# from 0 (invisible) through 255 (fully opaque). Alignment may be LEFT, CENTER,
# or RIGHT. See-through text remains disabled by default so shop details do not
# show through walls.
hologram-text-opacity: 255
hologram-text-shadowed: false
hologram-text-see-through: false
hologram-text-alignment: CENTER

# Set the global text palette used by every shop hologram. Players cannot
# override these colors. Each value must be a six-digit RGB hex color.
# Labels and values remain separate so the display is understandable without
# relying on color alone.
hologram-colors:
  owner: "#DCE7FF"
  quantity: "#D8E1EA"
  item: "#FFE29A"
  details: "#D8CCFF"
  label: "#C7D8E5"
  buy-value: "#B8EBCB"
  sell-value: "#FFC9B8"
  separator: "#BDD0DE"
  admin: "#FFC2CF"
  unavailable: "#FFD0D0"

# Set the maximum visible length of item names in the hologram. Longer custom
# names end in "...", while item inspection still shows the complete name.
# Set this to 0 to disable truncation. Values are clamped at 256.
hologram-max-item-name-length: 48

# Show at most seven enchantments and/or potion effects in the panel. When an
# item has more, the last line includes a localized "+N more" summary.
hologram-max-item-detail-entries: 7

# Keep metadata compact by placing two enchantments or potion effects per line.
# Values are clamped from 1 through 4.
hologram-item-details-per-line: 2

# Set whether the text panel should stay aligned with the front of its chest.
# Set this to false to make the panel rotate toward each viewer instead.
hologram-fixed-facing: true

# Set the floating product icon's position, size, and animation. Height and bob
# amplitude are measured in blocks. Animation periods are measured in seconds;
# a larger period means slower motion. Values are bounded to keep accidental
# commands from creating unusably large or excessively fast displays.
floating-icon-height: 1.21
floating-icon-scale: 0.45
floating-icon-bobbing-enabled: true
floating-icon-bob-amplitude: 0.06
floating-icon-bob-period-seconds: 3.14
floating-icon-rotation-enabled: true
floating-icon-rotation-period-seconds: 6.28

# Set whether players should be allowed to buy or sell less items
# than the vendor has specified, in case the player does not have enough
# money or items, or if the chest does not have enough items or space,
# or if the vendor does not have enough money.
# The price will be calculated correspondingly.
auto-calculate-item-amount: false

# Set whether prices may contain decimals (prices of existing shops will stay).
allow-decimals-in-price: true

# Set whether players should be allowed to sell/buy broken items.
allow-broken-items: false

# Set whether the level of a potion or tipped arrow (if upgraded) should be
# appended to the item name. If set to true, the level ("II") will be
# displayed after the item name, but only if the item does not have a
# custom name.
append-potion-level-to-item-name: false

# Set whether shops should automatically be removed from the database if
# an error occurred while loading.
# (e.g. no supported container, no display space above it, or unknown world)
remove-shop-on-error: false

# Set whether the mouse buttons should be inverted.
# Default:
# Right-Click -> Buy
# Left-Click -> Sell
invert-mouse-buttons: false

# Set the maximal distance (in blocks) to the shop where the
# player can see the hologram.
maximal-distance: 2

# Set the maximal distance (in blocks) to the shop where the
# player can see the floating shop item.
maximal-item-distance: 40

# Set whether the buy price must be greater than or equal to the sell price.
buy-greater-or-equal-sell: true

# Set the minimum and maximum prices for each individual item.
minimum-prices:
# "DIAMOND": 0.5

maximum-prices:
# "STONE": 2

# Compare proposed normal-shop prices with CMI's in-memory WorthManager data.
# This is advisory only: warnings never block creation or change a price.
# A resale-risk warning is shown whenever a customer could buy from the shop
# below CMI's /sell worth. The low/high multipliers catch less direct mistakes
# without warning about ordinary market variation.
cmi-worth-price-warning:
  enabled: true
  warn-resale-risk: true
  low-multiplier: 0.50
  high-multiplier: 20.00

# Public discovery is limited to normal customer-buy shops. MARKETPLACE mode
# discloses coordinates only for shops inside the named WorldGuard region in
# the named world. Set location-scope to GLOBAL to include eligible shops in
# every world; ordinary player results still never provide teleport actions.
storefront-discovery:
  location-scope: MARKETPLACE
  marketplace-world: general
  marketplace-region: shops
  search-cooldown-milliseconds: 1500
  snapshot-seconds: 30

# Storefront advertising is purchased with a captured, genuine AFK Shrine
# Token ItemStack. The plugin fails closed until an administrator captures the
# token with `/shops admin advertise currency capture` while holding one.
advertising:
  enabled: true
  token-cost: 5
  pass-days: 7
  broadcasts-per-pass: 3
  owner-cooldown-hours: 24
  global-cooldown-minutes: 30
  minimum-online-players: 6
  request-ttl-hours: 48
  poll-seconds: 15
  sound: minecraft:block.amethyst_block.chime

# Set the items of which a player can't create a shop.
blacklist:
# - "DIORITE"

# Set the price a player has to pay in order to create...
# You can set this to 0 to disable costs.
shop-creation-price:

  # ...a normal shop
  normal: 5

  # ...an admin shop
  admin: 0

# Shop limits are handled with permissions.
# A player with permission "shopchest.limit.X" has a limit of X shops,
# a player with permission "shopchest.limit.*" does not have a shop limit.
# Admin shops are excluded from the shop limit.
shop-limits:

  # Set the amount of shops that anyone who doesn't have a
  # specific permission may have.
  # If you don't want the players to have a limit by default
  # set the value to -1.
  default: 5

# Set the events of AreaShop when shops on that region should be removed.
# Valid values are: DELETE, UNRENT, RESELL, SELL
areashop-remove-shops:
  - "DELETE"
  - "UNRENT"
  - "RESELL"
  - "SELL"

# Set whether the custom WorldGuard flags should be allowed by default.
worldguard-default-flag-values:

  create-shop: false
  use-shop: false
  use-admin-shop: false

# Set the types of Towny plots where shop creation should be allowed.
# Valid values are:
# RESIDENTIAL, COMMERCIAL, ARENA, EMBASSY, WILDS, SPLEEF, INN, JAIL, FARM
towny-shop-plots:

  residents:
    - "COMMERCIAL"

  mayor:
    - "COMMERCIAL"

  king:
    - "COMMERCIAL"

# Configuration of the database, where everything is stored.
# Shops are found in the table 'shopchest_shops', and logged economy
# transactions are found in the table 'shopchest_economy_logs'
database:

  # Select the type of database which should be used
  # Either use 'SQLite' or 'MySQL'. Otherwise you will break the plugin!
  type: "SQLite"

  # Set the prefix of all table names related to this plugin.
  table-prefix: "shopchest_"

  # If the specified type is 'MySQL', here you configure the...
  mysql:

    # ...interval in seconds, when the database should be pinged,
    # to keep the connection alive
    # You can set this to '0' to disable the ping interval
    ping-interval: 3600

    # ...hostname where the database is accessible
    hostname: ""

    # ...port where the database is accessible (default: 3306)
    port: 3306

    # ...database you want to use
    database: ""

    # ...username you are going to login with
    username: ""

    # ...password you are going to login with
    password: ""
